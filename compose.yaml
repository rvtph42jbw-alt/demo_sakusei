services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      NODE_ENV: production
    volumes:
      - safety_data:/app/data
      - safety_backups:/app/backups
    expose:
      - "3000"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  safety_data:
  safety_backups:
  caddy_data:
  caddy_config:
